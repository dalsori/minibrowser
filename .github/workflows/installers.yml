name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to receive installers
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test memory scripts
        run: node --test tests/memory-script.test.cjs
      - name: Build installers
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - name: Verify Linux application registration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          dpkg-deb --contents "$deb" | tee /tmp/deb-contents.txt
          grep -E 'usr/share/applications/.*\.desktop$' /tmp/deb-contents.txt
          grep -E 'usr/share/icons/.*\.png$' /tmp/deb-contents.txt
          rpmfile=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' -print -quit)
          rpm -qlp "$rpmfile" | tee /tmp/rpm-contents.txt
          grep -E '/usr/share/applications/.*\.desktop$' /tmp/rpm-contents.txt
      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t installers < <(find src-tauri/target/release/bundle -type f \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' \))
          test "${#installers[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${installers[@]}" --clobber
