[package]
name = "minibrowser"
version = "0.1.0"
description = "Minimalist browser"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-global-shortcut = "2"
