<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Ajustes · Minibrowser</title><link rel="stylesheet" href="styles.css"><style>
.settings{padding:28px}.settings header{margin-bottom:24px}.setting{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 0;border-top:1px solid var(--border)}.setting-copy strong{display:block;font-size:15px}.setting-copy span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.switch{position:relative;flex:none;width:48px;height:28px}.switch input{position:absolute;width:1px;height:1px;opacity:0}.switch-track{position:absolute;inset:0;cursor:pointer;border:1px solid var(--border-strong);border-radius:99px;background:#242832}.switch-track:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#d8dce3;transition:transform .16s ease}.switch input:checked+.switch-track{border-color:var(--accent);background:var(--accent)}.switch input:checked+.switch-track:after{transform:translateX(20px);background:#10131a}.switch input:focus-visible+.switch-track{outline:3px solid rgba(140,169,255,.35);outline-offset:3px}.engines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px}.engines button{min-height:42px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#1b1e25;cursor:pointer}.engines button:hover{background:var(--surface-hover);border-color:var(--border-strong)}.engines button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#0c1018;font-weight:700}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.back{border:0;background:transparent;color:var(--muted);cursor:pointer}.back:hover{color:var(--text)}@media(max-width:480px){.settings{padding:22px 18px}.engines{grid-template-columns:1fr}.footer{align-items:flex-start;flex-direction:column-reverse}}
</style></head><body><main class="app-shell"><section class="card settings" aria-labelledby="title"><header><p class="eyebrow">Minibrowser</p><h1 id="title">Ajustes</h1><p class="lede">Tus preferencias se guardan automáticamente.</p></header><div class="setting"><div class="setting-copy"><strong id="adblock-label">Bloqueador de anuncios</strong><span>Reduce anuncios y rastreadores conocidos.</span></div><label class="switch"><input type="checkbox" id="adblock" aria-labelledby="adblock-label"><span class="switch-track"></span></label></div><div class="setting" style="display:block"><div class="setting-copy"><strong id="engine-label">Motor de búsqueda</strong><span>Se usa cuando el texto no es una dirección web.</span></div><div class="engines" role="group" aria-labelledby="engine-label"><button type="button" data-engine="ddg" aria-pressed="false">DuckDuckGo</button><button type="button" data-engine="google" aria-pressed="false">Google</button><button type="button" data-engine="bing" aria-pressed="false">Bing</button></div></div><footer class="footer"><button class="back" id="back" type="button">← Volver al inicio <span class="kbd">Esc</span></button><div id="status" class="status" role="status" aria-live="polite"></div></footer></section></main><script type="module">
import{invoke,setStatus}from'./tauri.js';const adblock=document.querySelector('#adblock'),engines=[...document.querySelectorAll('[data-engine]')],status=document.querySelector('#status'),selectEngine=engine=>engines.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.engine===engine)));async function save(command,args,rollback){setStatus(status,'Guardando…');try{await invoke(command,args);setStatus(status,'Guardado')}catch(error){rollback();setStatus(status,String(error),true)}}adblock.addEventListener('change',()=>{const value=adblock.checked;save('setadblock',{enabled:value},()=>{adblock.checked=!value})});engines.forEach(button=>button.addEventListener('click',()=>{const previous=engines.find(x=>x.getAttribute('aria-pressed')==='true')?.dataset.engine;selectEngine(button.dataset.engine);save('setengine',{engine:button.dataset.engine},()=>selectEngine(previous))}));const goHome=()=>invoke('home').catch(error=>setStatus(status,String(error),true));document.querySelector('#back').addEventListener('click',goHome);document.addEventListener('keydown',event=>{if(event.key==='Escape')goHome()});try{const state=await invoke('getstate');adblock.checked=state.adblock;selectEngine(state.engine)}catch(error){setStatus(status,String(error),true)}
</script><script type="module" src="memory-settings.js"></script></body></html>
