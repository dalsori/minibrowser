<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title> </title>
<style>
  :root {
    --bg0: #0a0a0b;
    --bg1: #111114;
    --bar-bg: rgba(255,255,255,0.035);
    --bar-border: rgba(255,255,255,0.08);
    --bar-border-focus: rgba(255,255,255,0.16);
    --icon: rgba(255,255,255,0.32);
    --text: rgba(255,255,255,0.78);
    --placeholder: rgba(255,255,255,0.30);
    --hint: rgba(255,255,255,0.34);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 90% 70% at 50% 42%, #15151a 0%, rgba(21,21,26,0) 55%),
      linear-gradient(180deg, var(--bg0) 0%, #0c0c0e 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }

  /* Barra de búsqueda */
  #bar {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 500px;
    height: 52px;
    padding: 0 14px 0 18px;
    border-radius: 16px;
    background: var(--bar-bg);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--bar-border);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -1px 0 rgba(255,255,255,0.02),
      0 18px 48px rgba(0,0,0,0.55),
      0 4px 14px rgba(0,0,0,0.35);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  #bar.focus {
    border-color: var(--bar-border-focus);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      0 18px 56px rgba(0,0,0,0.6),
      0 4px 16px rgba(0,0,0,0.4),
      0 0 0 4px rgba(255,255,255,0.025);
  }

  /* Icono de búsqueda */
  #icon {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    color: var(--icon);
  }
  #icon svg { width: 17px; height: 17px; }

  /* Input */
  #input {
    flex: 1 1 auto;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.01em;
    caret-color: rgba(255,255,255,0.7);
  }
  #input::placeholder { color: var(--placeholder); }

  /* Indicador de atajo */
  #kbd {
    flex: 0 0 auto;
    padding: 4px 9px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: var(--hint);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }

  #hint {
    position: fixed;
    left: 50%;
    bottom: 42px;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.20);
    font-size: 12px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="bar">
      <div id="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input id="input" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
      <div id="kbd">&#8984;K</div>
    </div>
  </div>
  <div id="hint"></div>

<script>
  const input = document.getElementById('input');
  const bar = document.getElementById('bar');

  const go = (cmd, args) => { try { window.__TAURI__.core.invoke(cmd, args); } catch (_) {} };

  input.addEventListener('focus', () => bar.classList.add('focus'));
  input.addEventListener('blur', () => bar.classList.remove('focus'));

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const q = input.value.trim();
      if (q) go('open', { query: q });
    } else if (e.key === 'Escape') {
      input.value = '';
      input.blur();
    }
  });

  input.focus();
  input.select();
</script>
</body>
</html>
