<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Minibrowser</title><link rel="stylesheet" href="styles.css"><style>
.home{width:min(100%,720px)}.hero{margin-bottom:24px;text-align:center}.search-box{display:flex;align-items:center;gap:12px;padding:8px 9px 8px 18px;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.search-box:focus-within{border-color:var(--accent);box-shadow:var(--shadow),0 0 0 4px rgba(140,169,255,.12)}.search-icon{width:20px;color:var(--muted);flex:none}#search-input{width:100%;height:44px;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}#search-input::placeholder{color:#7f8793}.actions{display:flex;justify-content:center;gap:18px;margin-top:18px;color:var(--muted);font-size:12px}.actions span{display:flex;align-items:center;gap:7px}.status{margin-top:12px;text-align:center}@media(max-width:480px){.hero{text-align:left}.actions{align-items:flex-start;flex-direction:column;gap:8px}.search-box>.kbd{display:none}}
</style></head><body><main class="app-shell"><section class="home" aria-labelledby="title"><header class="hero"><p class="eyebrow">Minibrowser</p><h1 id="title">¿Adónde vamos?</h1><p class="lede">Busca en la web o escribe una dirección.</p></header><form id="search-form" class="search-box" novalidate><svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><label for="search-input" hidden>Búsqueda o dirección</label><input id="search-input" name="query" type="text" placeholder="Buscar o escribir una dirección" autocomplete="off" spellcheck="false" autofocus><span class="kbd" id="focus-shortcut" aria-hidden="true"></span></form><div id="status" class="status" role="status" aria-live="polite"></div><div class="actions" aria-label="Atajos"><span><kbd class="kbd" id="settings-shortcut"></kbd> Ajustes</span><span><kbd class="kbd" id="workspace-shortcut"></kbd> Nuevo espacio</span></div></section></main><script type="module">
import{invoke,platformShortcut,setStatus}from'./tauri.js';const form=document.querySelector('#search-form'),input=document.querySelector('#search-input'),status=document.querySelector('#status');document.querySelector('#focus-shortcut').textContent=platformShortcut('K');document.querySelector('#settings-shortcut').textContent=platformShortcut('E');document.querySelector('#workspace-shortcut').textContent=platformShortcut('T');form.addEventListener('submit',async e=>{e.preventDefault();const query=input.value.trim();if(!query){setStatus(status,'Escribe una búsqueda o dirección.',true);input.focus();return}setStatus(status,'Abriendo…');try{const url=await invoke('open',{query});window.location.assign(url)}catch(error){setStatus(status,String(error),true)}});input.addEventListener('input',()=>setStatus(status));input.addEventListener('keydown',e=>{if(e.key==='Escape'){input.value='';setStatus(status);input.blur()}});
</script></body></html>
